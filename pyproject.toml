[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "interp-lab"
version = "2.3.0"
description = "Criterion-driven feature discovery, explanation, causal testing, and cross-model activation matching."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "interp-lab contributors" }
]
keywords = [
  "mechanistic-interpretability",
  "sparse-autoencoders",
  "activation-steering",
  "crosscoders",
  "natural-language-autoencoders"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/asystemoffields/interp-lab"
Repository = "https://github.com/asystemoffields/interp-lab"
Issues = "https://github.com/asystemoffields/interp-lab/issues"
Documentation = "https://github.com/asystemoffields/interp-lab#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=6.0"
]
saelens = [
  "sae-lens>=6.0"
]
hf = [
  "torch>=2.0",
  "transformers>=4.38"
]
transformerlens = [
  "torch>=2.0",
  "transformer-lens>=3.0"
]
nnsight = [
  "torch>=2.0",
  "nnsight>=0.6"
]
goodfire = [
  "goodfire>=0.3"
]
embeddings = [
  "sentence-transformers>=3.0"
]
gguf = [
  "llama-cpp-python>=0.3"
]
modal = [
  "modal>=1.4"
]
publish = [
  "huggingface-hub>=1.0"
]
train = [
  "torch>=2.0"
]
all = [
  "torch>=2.0",
  "transformers>=4.38",
  "sae-lens>=6.0",
  "transformer-lens>=3.0",
  "nnsight>=0.6",
  "goodfire>=0.3",
  "modal>=1.4",
  "huggingface-hub>=1.0",
  "sentence-transformers>=3.0"
]

[project.scripts]
interp-lab = "interp_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interp_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
